name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify package version metadata
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          sys.path.insert(0, "src")
          import agy_lark

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = pyproject["project"]["version"]
          assert agy_lark.__version__ == pkg_version, (
              f"Version mismatch: pyproject.toml={pkg_version!r}, "
              f"agy_lark.__version__={agy_lark.__version__!r}"
          )

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("refs/tags/v"):
              tag_version = ref_name.removeprefix("v")
              assert tag_version == pkg_version, (
                  f"Tag version mismatch: tag={ref_name!r}, pyproject.toml={pkg_version!r}"
              )
          print(f"Verified version consistency: {pkg_version}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        shell: bash
        run: |
          python -m build
          ls -la dist
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify Wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install built wheel into clean venv and verify sdist + tests
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tarfile
          import venv

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          dist_dir = pathlib.Path("dist").resolve()
          wheels = list(dist_dir.glob("*.whl"))
          sdists = list(dist_dir.glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected 1 wheel, found: {wheels}"
          assert len(sdists) == 1, f"Expected 1 sdist, found: {sdists}"
          wheel_path = wheels[0]
          sdist_path = sdists[0]

          venv_dir = runner_temp / "wheel-venv"
          venv.create(venv_dir, with_pip=True)
          bin_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          venv_python = str(bin_dir / ("python.exe" if os.name == "nt" else "python"))
          cli_path = bin_dir / ("agy-lark.exe" if os.name == "nt" else "agy-lark")

          subprocess.run([venv_python, "-m", "pip", "install", "--upgrade", "pip"], check=True)
          subprocess.run([venv_python, "-m", "pip", "install", str(wheel_path)], check=True)
          subprocess.run([venv_python, "-m", "pip", "check"], check=True)

          # 在仓库外部路径验证安装后的命令行入口与 site-packages 导入来源
          subprocess.run([str(cli_path), "--help"], cwd=str(runner_temp), check=True)
          import_check = (
              "import agy_lark, importlib.metadata as m; "
              "print('IMPORTED:', agy_lark.__file__, agy_lark.__version__, m.version('agy-lark')); "
              "assert 'site-packages' in str(agy_lark.__file__).lower(); "
              "assert agy_lark.__version__ == m.version('agy-lark')"
          )
          subprocess.run([venv_python, "-W", "error", "-c", import_check], cwd=str(runner_temp), check=True)

          # 解压 sdist 验证源码包完整性，并以已安装的 wheel 运行全量离线测试
          sdist_unpack = runner_temp / "sdist-unpack"
          sdist_unpack.mkdir(parents=True, exist_ok=True)
          with tarfile.open(sdist_path, "r:gz") as tf:
              kwargs = {"filter": "data"} if hasattr(tarfile, "data_filter") else {}
              tf.extractall(sdist_unpack, **kwargs)

          roots = [p for p in sdist_unpack.iterdir() if p.is_dir()]
          assert len(roots) == 1, f"Expected 1 unpacked root dir, found: {roots}"
          subprocess.run(
              [venv_python, "-W", "error", "-m", "unittest", "discover", "-s", "tests", "-v"],
              cwd=str(roots[0]),
              check=True,
          )
          PY

  release:
    name: Publish GitHub Release
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.whl)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No distribution artifacts found in dist/" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
